name: Build and release Caddy

on:
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: read
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: caddy-linux-amd64.tar.gz
            binary: caddy
          - goos: linux
            goarch: arm64
            asset: caddy-linux-arm64.tar.gz
            binary: caddy
          - goos: darwin
            goarch: amd64
            asset: caddy-darwin-amd64.tar.gz
            binary: caddy
          - goos: darwin
            goarch: arm64
            asset: caddy-darwin-arm64.tar.gz
            binary: caddy
          - goos: windows
            goarch: amd64
            asset: caddy-windows-amd64.zip
            binary: caddy.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install xcaddy
        shell: bash
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Caddy with vendor plugins
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/caddy-build"
          mkdir -p "$build_dir"
          args=()
          while IFS= read -r plugin; do
            plugin="${plugin//$'\r'/}"
            [[ -z "${plugin//[[:space:]]/}" ]] && continue
            [[ "$plugin" == \#* ]] && continue
            args+=(--with "$plugin")
          done < vendor/caddy/plugins.txt
          xcaddy build --output "$build_dir/${{ matrix.binary }}" "${args[@]}"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/caddy-build"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd "$build_dir" && zip -q "$GITHUB_WORKSPACE/${{ matrix.asset }}" "${{ matrix.binary }}")
          else
            tar -C "$build_dir" -czf "$GITHUB_WORKSPACE/${{ matrix.asset }}" "${{ matrix.binary }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish caddy release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: caddy-*
          merge-multiple: true
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caddy
          name: Caddy (custom build)
          prerelease: false
          make_latest: false
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
